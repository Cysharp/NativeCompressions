name: Build-Native-OpenZL

# Follow OpenZL latest release by cron update
# 1.  Check for OpenZL updates - compare submodule commit ID with latest release commit
# 2.  If no changes, checkout in each build job, build and upload artifacts.
# 2". If changes exist, update submodule after checkout in each build job, build and upload artifacts
# 3.  Upload packages to GitHub Actions summary
# 4.  If the submodule or generated binaries differ, create or update the release's PR.
#     Binary-only differences (submodule unchanged) only open a PR on a workflow_dispatch run, to avoid Windows hosted runner changes affecting the binaries.
#     PR includes following changes.
#     - Commit that updates the submodule
#     - Commit that openzl dynamic lib artifacts placed in src/NativeCompressions.OpenZL.Runtime/runtimes/{platform_name}/native/{lib}
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Every day at 3:00 AM (UTC)

jobs:
  check_new_release:
    permissions:
      contents: read
    uses: ./.github/workflows/check-new-release.yaml
    with:
      repository: facebook/openzl
      submodule_path: openzl

  build-windows:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        arch: [x64]
        include:
          - arch: x64
            platform: x64
            msys_env: MINGW64
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd openzl
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated OpenZL submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Setup MSYS2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2.30.0
        with:
          msystem: ${{ matrix.msys_env }}
          update: true
          install: >-
            ${{ matrix.arch == 'x64' && 'mingw-w64-x86_64-gcc mingw-w64-x86_64-make' || 'mingw-w64-clang-aarch64-gcc mingw-w64-clang-aarch64-make' }}
            make
      # TODO: Currently, the build artifact extension is .so even on Windows. OpenZL may update the Makefile in the future to create .dll files for Windows, which could cause CI errors. Please update the file extensions accordingly if this change occurs.
      # OpenZL uses zstd/lz4 *_STATIC_LINKING_ONLY APIs, which have no stable ABI. Link the versions it pins
      # (openzl/deps) statically and export only OpenZL's API (ZL_*, ZS2_*), like upstream's Python wheel
      # (openzl/py/pyproject.toml). Upstream `make libopenzl.so` links its shared deps/ builds instead,
      # which the Runtime package does not ship.
      # -static-libgcc: the Runtime package does not ship MinGW's libgcc_s_seh-1.dll either.
      - name: Build DLL
        shell: msys2 {0}
        working-directory: openzl
        run: |
          CFLAGS="-O3" make -C deps/zstd/lib libzstd.a CC=gcc -j "$(nproc)"
          CFLAGS="-O3" make -C deps/lz4/lib liblz4.a CC=gcc -j "$(nproc)"
          mkdir -p nc-static
          cp deps/zstd/lib/libzstd.a deps/lz4/lib/liblz4.a nc-static/

          # LIBZSTD_SO/LIBLZ4_SO are the link inputs of the libopenzl.so rule; -o keeps make from rebuilding them.
          # LDFLAGS goes on the command line because OpenZL's zldefs.make appends an environment LDFLAGS twice.
          make_openzl() {
            make libopenzl.so BUILD_TYPE=OPT OS=Windows_NT CC=gcc MOREFLAGS="-flto" \
              LIBZSTD_SO=nc-static/libzstd.a LIBLZ4_SO=nc-static/liblz4.a \
              -o nc-static/libzstd.a -o nc-static/liblz4.a \
              LDFLAGS="-Wl,--no-insert-timestamp $1" -j "$(nproc)"
          }
          # MinGW takes no export wildcards: link once exporting everything to learn the names,
          # then relink with a .def of only OpenZL's API (an explicit .def turns auto-export off).
          make_openzl "-static-libgcc -Wl,--output-def,nc-static/all.def"
          {
            echo EXPORTS
            awk '$1 ~ /^(ZL|ZS2)_[A-Za-z0-9_]*$/ { print "    " $1 ($0 ~ / DATA/ ? " DATA" : "") }' nc-static/all.def
          } > nc-static/exports.def
          make_openzl "-static-libgcc nc-static/exports.def"
          ls -la libopenzl.so
          file -L libopenzl.so
      - name: Verify self-contained DLL
        shell: msys2 {0}
        working-directory: openzl
        run: |
          objdump -p libopenzl.so > nc-static/headers.txt
          grep 'DLL Name' nc-static/headers.txt
          if grep 'DLL Name' nc-static/headers.txt | grep -iE 'zstd|lz4|libgcc|winpthread'; then
            echo "::error::libopenzl.dll depends on a DLL the Runtime package does not ship"
            exit 1
          fi
          grep -q ' ZL_CCtx_compress$' nc-static/headers.txt
          if grep -E ' (ZSTD|ZDICT|LZ4|XXH|HUF|FSE)_' nc-static/headers.txt; then
            echo "::error::libopenzl.dll exports bundled zstd/lz4 symbols"
            exit 1
          fi
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/win-${{ matrix.arch }}
          cp -L openzl/libopenzl.so artifacts/win-${{ matrix.arch }}/libopenzl.dll
      - name: Upload Windows artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-win-${{ matrix.arch }}
          path: artifacts/win-${{ matrix.arch }}/*
          if-no-files-found: error

  build-windows-arm64:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd openzl
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated openzl submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      # TODO: Currently, the build artifact extension is .so even on Windows. OpenZL may update the Makefile in the future to create .dll files for Windows, which could cause CI errors. Please update the file extensions accordingly if this change occurs.
      # zstd/lz4 are linked statically and only OpenZL's API is exported, same as the build-windows job.
      - name: Build using Docker
        run: |
          docker run --rm -i -v "$PWD:/work" -w /work/openzl mstorsjo/llvm-mingw:latest bash -euo pipefail -s <<'EOF'
          git config --global --add safe.directory '*'
          CC=aarch64-w64-mingw32-gcc
          CFLAGS="-O3" make -C deps/zstd/lib libzstd.a CC="$CC" AR=llvm-ar -j "$(nproc)"
          CFLAGS="-O3" make -C deps/lz4/lib liblz4.a CC="$CC" AR=llvm-ar -j "$(nproc)"
          mkdir -p nc-static
          cp deps/zstd/lib/libzstd.a deps/lz4/lib/liblz4.a nc-static/

          # LIBZSTD_SO/LIBLZ4_SO are the link inputs of the libopenzl.so rule; -o keeps make from rebuilding them.
          # LDFLAGS goes on the command line because OpenZL's zldefs.make appends an environment LDFLAGS twice.
          make_openzl() {
            make libopenzl.so BUILD_TYPE=OPT OS=Windows_NT CC="$CC" MOREFLAGS="-flto" \
              LIBZSTD_SO=nc-static/libzstd.a LIBLZ4_SO=nc-static/liblz4.a \
              -o nc-static/libzstd.a -o nc-static/liblz4.a \
              LDFLAGS="-Wl,--no-insert-timestamp $1" -j "$(nproc)"
          }
          # MinGW takes no export wildcards: link once exporting everything to learn the names,
          # then relink with a .def of only OpenZL's API (an explicit .def turns auto-export off).
          # Keep plain identifiers only: GCC LTO promotes cross-partition statics to globals named like
          # ZL_foo.lto_priv.0, which are not API, and GNU ld's .def parser rejects '.' in a name.
          make_openzl "-Wl,--output-def,nc-static/all.def"
          {
            echo EXPORTS
            awk '$1 ~ /^(ZL|ZS2)_[A-Za-z0-9_]*$/ { print "    " $1 ($0 ~ / DATA/ ? " DATA" : "") }' nc-static/all.def
          } > nc-static/exports.def
          make_openzl "nc-static/exports.def"
          llvm-objdump -p libopenzl.so > nc-static/headers.txt
          EOF
          file -L openzl/libopenzl.so
      - name: Verify self-contained DLL
        working-directory: openzl
        run: |
          grep 'DLL Name' nc-static/headers.txt
          if grep 'DLL Name' nc-static/headers.txt | grep -iE 'zstd|lz4|libgcc|winpthread|libunwind|libc\+\+'; then
            echo "::error::libopenzl.dll depends on a DLL the Runtime package does not ship"
            exit 1
          fi
          grep -q ' ZL_CCtx_compress$' nc-static/headers.txt
          if grep -E ' (ZSTD|ZDICT|LZ4|XXH|HUF|FSE)_' nc-static/headers.txt; then
            echo "::error::libopenzl.dll exports bundled zstd/lz4 symbols"
            exit 1
          fi
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/win-arm64
          cp -L openzl/libopenzl.so artifacts/win-arm64/libopenzl.dll
      - name: Upload artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-win-arm64
          path: artifacts/win-arm64/*
          if-no-files-found: error

  build-linux:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64, arm64]
        glibc: ["2.31"]
        cc: [gcc-10]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Pin glibc to matrix.glibc by building inside Ubuntu 20.04 (glibc 2.31) instead of letting the hosted runner image decide it.
    container:
      image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 15
    env:
      CC: ${{ matrix.cc }}
      GLIBC_VERSION: ${{ matrix.glibc }}
    steps:
      - name: Verify container glibc
        run: |
          actual="$(ldd --version | head -1 | awk '{ print $NF }')"
          if [ "${actual}" != "${GLIBC_VERSION}" ]; then
            echo "::error::container glibc is ${actual}, but matrix.glibc is ${GLIBC_VERSION}"
            exit 1
          fi
      # git must be present before checkout, otherwise actions/checkout falls back to the tarball API and skips submodules.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            file \
            "${CC}" \
            git \
            make
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd openzl
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated openzl submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      # OpenZL uses zstd/lz4 *_STATIC_LINKING_ONLY APIs, which have no stable ABI. Link the versions it pins
      # (openzl/deps) statically and export only OpenZL's API (ZL_*, ZS2_*), like upstream's Python wheel
      # (openzl/py/pyproject.toml). Upstream `make libopenzl.so` links its shared deps/ builds instead,
      # which the Runtime package does not ship.
      - name: Build shared library
        working-directory: openzl
        run: |
          CFLAGS="-O3 -fPIC" make -C deps/zstd/lib libzstd.a CC="${CC}" -j "$(nproc)"
          CFLAGS="-O3 -fPIC" make -C deps/lz4/lib liblz4.a CC="${CC}" -j "$(nproc)"
          mkdir -p nc-static
          cp deps/zstd/lib/libzstd.a deps/lz4/lib/liblz4.a nc-static/
          printf '{\n  global: ZL_*; ZS2_*;\n  local: *;\n};\n' > nc-static/exports.map

          # LIBZSTD_SO/LIBLZ4_SO are the link inputs of the libopenzl.so rule; -o keeps make from rebuilding them.
          # LDFLAGS goes on the command line because OpenZL's zldefs.make appends an environment LDFLAGS twice.
          make libopenzl.so BUILD_TYPE=OPT CC="${CC}" MOREFLAGS="-flto" \
            LIBZSTD_SO=nc-static/libzstd.a LIBLZ4_SO=nc-static/liblz4.a \
            -o nc-static/libzstd.a -o nc-static/liblz4.a \
            LDFLAGS="-Wl,--version-script=nc-static/exports.map -Wl,-soname,libopenzl.so -Wl,--no-undefined" \
            -j "$(nproc)"
          ls -la ./*.so*
          file -L libopenzl.so*
      - name: Verify self-contained library
        working-directory: openzl
        run: |
          readelf -d libopenzl.so | grep NEEDED
          if readelf -d libopenzl.so | grep NEEDED | grep -E 'zstd|lz4'; then
            echo "::error::libopenzl.so depends on a library the Runtime package does not ship"
            exit 1
          fi
          nm -D --defined-only libopenzl.so > nc-static/exports.txt
          grep -q ' ZL_CCtx_compress$' nc-static/exports.txt
          if grep -E ' (ZSTD|ZDICT|LZ4|XXH|HUF|FSE)_' nc-static/exports.txt; then
            echo "::error::libopenzl.so exports bundled zstd/lz4 symbols"
            exit 1
          fi
      - name: Verify glibc requirement
        run: |
          max_glibc="$(objdump -T openzl/libopenzl.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "libopenzl.so requires glibc ${max_glibc} or newer"
          if [ "$(printf '%s\n%s\n' "${max_glibc}" "${GLIBC_VERSION}" | sort -V | tail -1)" != "${GLIBC_VERSION}" ]; then
            echo "::error::libopenzl.so requires glibc ${max_glibc}, above matrix.glibc (${GLIBC_VERSION})"
            exit 1
          fi
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/linux-${{ matrix.arch }}
          cp -L openzl/libopenzl.so artifacts/linux-${{ matrix.arch }}/
      - name: Upload Linux artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-linux-${{ matrix.arch }}
          path: artifacts/linux-${{ matrix.arch }}/*
          if-no-files-found: error

  build-macos:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            flags: "-arch x86_64"
          - arch: arm64
            flags: "-arch arm64"
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd openzl
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated openzl submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      # TODO: Currently, the build artifact extension is .so even on macOS. OpenZL may update the Makefile in the future to create .dylib files for macOS, which could cause CI errors. Please update the file extensions accordingly if this change occurs.
      # OpenZL uses zstd/lz4 *_STATIC_LINKING_ONLY APIs, which have no stable ABI. Link the versions it pins
      # (openzl/deps) statically and export only OpenZL's API (ZL_*, ZS2_*), like upstream's Python wheel
      # (openzl/py/pyproject.toml). Upstream `make libopenzl.so` links its shared deps/ builds instead,
      # which the Runtime package does not ship (and records their /usr/local/lib install names).
      # NOTE: CC carries the arch so it reaches the zstd/lz4 builds too; zstd's
      # SET_CACHE_DIRECTORY re-invokes make, and CC is the most robust carrier for it.
      # CXXFLAGS is needed because OpenZL's addTargetAsmObject macro uses $(CC) $(CXXFLAGS)
      # for .S files (not CFLAGS).
      - name: Build dynamic library
        working-directory: openzl
        env:
          CC: "clang ${{ matrix.flags }}"
          CFLAGS: ${{ matrix.flags }}
          CXXFLAGS: ${{ matrix.flags }}
          ARCH_FLAGS: ${{ matrix.flags }}
        run: |
          CFLAGS="-O3" make -C deps/zstd/lib libzstd.a CC="${CC}" -j "$(sysctl -n hw.ncpu)"
          CFLAGS="-O3" make -C deps/lz4/lib liblz4.a CC="${CC}" -j "$(sysctl -n hw.ncpu)"
          mkdir -p nc-static
          cp deps/zstd/lib/libzstd.a deps/lz4/lib/liblz4.a nc-static/
          printf '_ZL_*\n_ZS2_*\n' > nc-static/exports.txt

          # LIBZSTD_SO/LIBLZ4_SO are the link inputs of the libopenzl.so rule; -o keeps make from rebuilding them.
          # LDFLAGS goes on the command line because OpenZL's zldefs.make appends an environment LDFLAGS twice.

          # No -flto here, unlike the other platforms: Xcode 16.4's clang (macos-15) miscompiles OpenZL v0.2.0 under LTO. The inlined decompressTrID passes a constant 0 as the element count to checkedBitpackDecode32, so every standard transform ID decodes as 0 and ZL_DCtx_decompress fails with "Transform 0 is not supported in formatVersion 24"
          # make libopenzl.so BUILD_TYPE=OPT CC="${CC}" MOREFLAGS="-flto" \

          make libopenzl.so BUILD_TYPE=OPT CC="${CC}" \
            LIBZSTD_SO=nc-static/libzstd.a LIBLZ4_SO=nc-static/liblz4.a \
            -o nc-static/libzstd.a -o nc-static/liblz4.a \
            LDFLAGS="${ARCH_FLAGS} -Wl,-exported_symbols_list,nc-static/exports.txt -Wl,-install_name,@rpath/libopenzl.dylib" \
            -j "$(sysctl -n hw.ncpu)"
          ls -la
          lipo -info libopenzl.so
          file -L libopenzl.so
      - name: Verify self-contained library
        working-directory: openzl
        run: |
          otool -L libopenzl.so
          if otool -L libopenzl.so | grep -E 'zstd|lz4'; then
            echo "::error::libopenzl.dylib depends on a library the Runtime package does not ship"
            exit 1
          fi
          nm -gU libopenzl.so > nc-static/exports-actual.txt
          grep -q ' _ZL_CCtx_compress$' nc-static/exports-actual.txt
          if grep -E ' _(ZSTD|ZDICT|LZ4|XXH|HUF|FSE)_' nc-static/exports-actual.txt; then
            echo "::error::libopenzl.dylib exports bundled zstd/lz4 symbols"
            exit 1
          fi
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/osx-${{ matrix.arch }}
          cp -L openzl/libopenzl.so artifacts/osx-${{ matrix.arch }}/libopenzl.dylib
      - name: Upload artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-osx-${{ matrix.arch }}
          path: artifacts/osx-${{ matrix.arch }}/*
          if-no-files-found: error

  build-ios:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            sdk: iphoneos
            target: aarch64-apple-ios11.0
            cflags: "-arch arm64 -mios-version-min=11.0"
          - arch: x86_64
            sdk: iphonesimulator
            target: x86_64-apple-ios11.0-simulator
            cflags: "-arch x86_64 -mios-simulator-version-min=11.0"
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd openzl
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated openzl submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Build static library for iOS
        env:
          ZERO_AR_DATE: "1" # Apple ar/libtool/ranlib write a zero mtime into the .a so rebuilds are byte-identical
        run: |
          SDK_PATH=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)

          # Build static library (iOS App Store requires static linking)
          cd openzl
          make libopenzl.a BUILD_TYPE=OPT CC="clang" MOREFLAGS="${{ matrix.cflags }} -isysroot $SDK_PATH" -j "$(sysctl -n hw.ncpu)"

          ls -la
          file -L libopenzl.a
          lipo -info libopenzl.a
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/ios-${{ matrix.arch }}
          cp -L openzl/libopenzl.a artifacts/ios-${{ matrix.arch }}/
      - name: Upload iOS artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-ios-${{ matrix.arch }}
          path: artifacts/ios-${{ matrix.arch }}/*
          if-no-files-found: error

  build-catalyst:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        include:
          - arch: arm64
            clang-arch: arm64
          - arch: x64
            clang-arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd openzl
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated openzl submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Build static library for Mac Catalyst
        env:
          ZERO_AR_DATE: "1" # Apple ar/libtool/ranlib write a zero mtime into the .a so rebuilds are byte-identical
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE"
          output="$root/openzl"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          lz4="$root/src/NativeCompressions.LZ4.Runtime/runtimes/maccatalyst-${{ matrix.arch }}/native/liblz4.a"
          zstd="$root/src/NativeCompressions.Zstandard.Runtime/runtimes/maccatalyst-${{ matrix.arch }}/native/libzstd.a"
          test -f "$lz4"
          test -f "$zstd"
          # OpenZL's archive excludes dependencies. Use our Runtime headers/archives
          # and prevent upstream make from rebuilding host libraries under deps/.
          make -C openzl libopenzl.a BUILD_TYPE=OPT \
            CC="$(xcrun --find clang)" AR="$(xcrun --find ar)" \
            MOREFLAGS="-target ${{ matrix.clang-arch }}-apple-ios15.0-macabi -isysroot $sdk" \
            CPPFLAGS="-I. -Iinclude -Isrc -Icpp/include -Icpp/src -I$root/zstd/lib -I$root/lz4/lib -DNDEBUG" \
            LIBZSTD_A="$zstd" LIBLZ4_A="$lz4" -o "$zstd" -o "$lz4" \
            CACHE_ROOT="$output/cachedObjs/catalyst" -j "$(sysctl -n hw.ncpu)"
          file -L "$output/libopenzl.a"
          lipo -info "$output/libopenzl.a"
          test "$(xcrun lipo -archs "$output/libopenzl.a")" = "${{ matrix.clang-arch }}"
          find "$output/cachedObjs/catalyst" -name '*.o' -print0 | while IFS= read -r -d '' object; do
            xcrun vtool -show-build "$object" | grep MACCATALYST
          done
          xcrun nm -gU "$output/libopenzl.a" > "$output/symbols.txt"
          xcrun nm -u "$output/libopenzl.a" > "$output/undefined-symbols.txt"
          grep ' _ZL_CCtx_compress$' "$output/symbols.txt"
          grep ' _ZL_DCtx_decompress$' "$output/symbols.txt"
          if grep -E ' _(ZSTD_|LZ4_|XXH)' "$output/symbols.txt"; then
            echo 'Unexpected bundled LZ4/Zstandard/xxHash symbols' >&2
            exit 1
          fi
          if grep -E ' (__Z|___cxa|___gxx)' "$output/undefined-symbols.txt"; then
            echo 'Unexpected C++ runtime dependency' >&2
            exit 1
          fi
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/maccatalyst-${{ matrix.arch }}
          cp -L openzl/libopenzl.a artifacts/maccatalyst-${{ matrix.arch }}/
      - name: Upload Catalyst artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-maccatalyst-${{ matrix.arch }}
          path: artifacts/maccatalyst-${{ matrix.arch }}/*
          if-no-files-found: error

  build-android:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # TODO: Building with armeabi-v7a is currently not possible due to the following build error: `sizeof(HeapMeta) == 16: sizeof(HeapMeta) must be 16 to guarantee alignment, but the expression evaluates to '8 == 16'.`
        # .This error indicates that OpenZL hasn't support for 32-bit architectures currently (including armeabi-v7a).
        abi: [arm64-v8a, x86_64]
        include:
          # - abi: armeabi-v7a
          #   arch: arm # Unity require this for mobile app
          #   target: armv7a-linux-androideabi21
          #   cc: armv7a-linux-androideabi21-clang
          - abi: arm64-v8a
            arch: arm64 # Most mobile app
            target: aarch64-linux-android21
            cc: aarch64-linux-android21-clang
          - abi: x86_64
            arch: x86_64 # Chromebook and Google Play for PC (not emulation)
            target: x86_64-linux-android21
            cc: x86_64-linux-android21-clang
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd openzl
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated openzl submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Setup Android NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false
      # zstd/lz4 are linked statically and only OpenZL's API is exported, same as the build-linux job.
      - name: Build shared library for Android
        working-directory: openzl
        env:
          CC: ${{ matrix.cc }}
        run: |
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          CFLAGS="-O3 -fPIC" make -C deps/zstd/lib libzstd.a CC="${CC}" AR=llvm-ar -j "$(nproc)"
          CFLAGS="-O3 -fPIC" make -C deps/lz4/lib liblz4.a CC="${CC}" AR=llvm-ar -j "$(nproc)"
          mkdir -p nc-static
          cp deps/zstd/lib/libzstd.a deps/lz4/lib/liblz4.a nc-static/
          printf '{\n  global: ZL_*; ZS2_*;\n  local: *;\n};\n' > nc-static/exports.map

          # LIBZSTD_SO/LIBLZ4_SO are the link inputs of the libopenzl.so rule; -o keeps make from rebuilding them.
          # LDFLAGS goes on the command line because OpenZL's zldefs.make appends an environment LDFLAGS twice.
          make libopenzl.so BUILD_TYPE=OPT CC="${CC}" STRIP=llvm-strip MOREFLAGS="-flto" \
            LIBZSTD_SO=nc-static/libzstd.a LIBLZ4_SO=nc-static/liblz4.a \
            -o nc-static/libzstd.a -o nc-static/liblz4.a \
            LDFLAGS="-Wl,--version-script=nc-static/exports.map -Wl,-soname,libopenzl.so -Wl,--no-undefined" \
            -j "$(nproc)"
          ls -la libopenzl.so
          file -L libopenzl.so
      - name: Verify self-contained library
        working-directory: openzl
        run: |
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          llvm-readelf -d libopenzl.so | grep NEEDED
          if llvm-readelf -d libopenzl.so | grep NEEDED | grep -E 'zstd|lz4'; then
            echo "::error::libopenzl.so depends on a library the Runtime package does not ship"
            exit 1
          fi
          llvm-nm -D --defined-only libopenzl.so > nc-static/exports.txt
          grep -q ' ZL_CCtx_compress$' nc-static/exports.txt
          if grep -E ' (ZSTD|ZDICT|LZ4|XXH|HUF|FSE)_' nc-static/exports.txt; then
            echo "::error::libopenzl.so exports bundled zstd/lz4 symbols"
            exit 1
          fi
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/android-${{ matrix.arch }}
          cp -L openzl/libopenzl.so artifacts/android-${{ matrix.arch }}/
      - name: Upload Android artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-android-${{ matrix.arch }}
          path: artifacts/android-${{ matrix.arch }}/*
          if-no-files-found: error

  package-all:
    needs:
      [
        check_new_release,
        build-windows,
        build-windows-arm64,
        build-linux,
        build-macos,
        build-ios,
        build-catalyst,
        build-android,
      ]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download all artifacts
        uses: Cysharp/Actions/.github/actions/download-artifact@main
        with:
          path: artifacts
      - name: Create .NET runtime structure
        run: |
          mkdir -p release/runtimes/{win-x64,win-arm64}/native
          mkdir -p release/runtimes/{linux-x64,linux-arm64}/native
          mkdir -p release/runtimes/{osx-x64,osx-arm64}/native
          mkdir -p release/runtimes/{android-arm,android-arm64,android-x64}/native
          mkdir -p release/runtimes/{ios-arm64,ios-x64}/native
          mkdir -p release/runtimes/{maccatalyst-arm64,maccatalyst-x64}/native

          # Windows
          if [ -f artifacts/openzl-win-x64/libopenzl.dll ]; then
            cp artifacts/openzl-win-x64/libopenzl.dll release/runtimes/win-x64/native/
          fi
          if [ -f artifacts/openzl-win-arm64/libopenzl.dll ]; then
            cp artifacts/openzl-win-arm64/libopenzl.dll release/runtimes/win-arm64/native/
          fi

          # Linux
          if [ -f artifacts/openzl-linux-x64/libopenzl.so ]; then
            cp artifacts/openzl-linux-x64/libopenzl.so release/runtimes/linux-x64/native/
          fi
          if [ -f artifacts/openzl-linux-arm64/libopenzl.so ]; then
            cp artifacts/openzl-linux-arm64/libopenzl.so release/runtimes/linux-arm64/native/
          fi

          # macOS
          for file in artifacts/openzl-osx-x64/*.dylib; do
            [ -f "$file" ] && cp "$file" release/runtimes/osx-x64/native/libopenzl.dylib && break
          done
          for file in artifacts/openzl-osx-arm64/*.dylib; do
            [ -f "$file" ] && cp "$file" release/runtimes/osx-arm64/native/libopenzl.dylib && break
          done

          # iOS
          if [ -f artifacts/openzl-ios-arm64/libopenzl.a ]; then
            cp artifacts/openzl-ios-arm64/libopenzl.a release/runtimes/ios-arm64/native/
          fi
          if [ -f artifacts/openzl-ios-x86_64/libopenzl.a ]; then
            cp artifacts/openzl-ios-x86_64/libopenzl.a release/runtimes/ios-x64/native/
          fi

          # Catalyst
          if [ -f artifacts/openzl-maccatalyst-arm64/libopenzl.a ]; then
            cp artifacts/openzl-maccatalyst-arm64/libopenzl.a release/runtimes/maccatalyst-arm64/native/
          fi
          if [ -f artifacts/openzl-maccatalyst-x64/libopenzl.a ]; then
            cp artifacts/openzl-maccatalyst-x64/libopenzl.a release/runtimes/maccatalyst-x64/native/
          fi

          # Android
          if [ -f artifacts/openzl-android-arm/libopenzl.so ]; then
            cp artifacts/openzl-android-arm/libopenzl.so release/runtimes/android-arm/native/
          fi
          if [ -f artifacts/openzl-android-arm64/libopenzl.so ]; then
            cp artifacts/openzl-android-arm64/libopenzl.so release/runtimes/android-arm64/native/
          fi
          if [ -f artifacts/openzl-android-x86_64/libopenzl.so ]; then
            cp artifacts/openzl-android-x86_64/libopenzl.so release/runtimes/android-x64/native/
          fi
      - name: Create archives
        run: |
          cd release
          tar czf ../openzl-native-libraries.tar.gz .
          zip -r ../openzl-native-libraries.zip .
      - name: Upload package
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: openzl-native-package
          path: |
            openzl-native-libraries.tar.gz
          if-no-files-found: error

  create-pr:
    needs: [check_new_release, package-all]
    if: ${{ needs.package-all.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      commit_sha: ${{ steps.create_pr.outputs.commit_sha }}
    env:
      NEW_BRANCH_NAME: "automate/openzl-${{ needs.check_new_release.outputs.latest_tag }}"
      LATEST_TAG: ${{ needs.check_new_release.outputs.latest_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
      - name: Configure Git
        run: |
          git remote set-url origin "https://github-actions:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create new branch
        run: git checkout -b "${NEW_BRANCH_NAME}"
      # update submodule
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          echo "Updated openzl submodule to ${LATEST_TAG}"
          cd openzl
            git fetch --tags
            git checkout "${LATEST_TAG}"
          cd ..
      # update runtimes
      - name: Download all artifacts
        uses: Cysharp/Actions/.github/actions/download-artifact@main
        with:
          path: artifacts
      - name: Place new runtimes
        env:
          DEST_BASE_PATH: src/NativeCompressions.OpenZL.Runtime/runtimes
        run: |
          echo "Updated openzl runtimes to ${LATEST_TAG}"

          for arch in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64 ios-arm64 ios-x64 maccatalyst-arm64 maccatalyst-x64 android-arm android-arm64 android-x64; do
            mkdir -p "${DEST_BASE_PATH}/${arch}/native"
          done

          # Show current
          echo "::group::Show artifacts/"
            ls -lR artifacts/
          echo "::endgroup::"

          echo "::group::Show ${DEST_BASE_PATH}/"
            ls -lR "${DEST_BASE_PATH}/"
          echo "::endgroup::"

          echo "::group::Copy new files"

            # Windows
            if [ -f artifacts/openzl-win-x64/libopenzl.dll ]; then
              cp -f artifacts/openzl-win-x64/libopenzl.dll "${DEST_BASE_PATH}/win-x64/native/libopenzl.dll"
            fi
            if [ -f artifacts/openzl-win-arm64/libopenzl.dll ]; then
              cp -f artifacts/openzl-win-arm64/libopenzl.dll "${DEST_BASE_PATH}/win-arm64/native/libopenzl.dll"
            fi

            # Linux
            if [ -f artifacts/openzl-linux-x64/libopenzl.so ]; then
              cp -f artifacts/openzl-linux-x64/libopenzl.so "${DEST_BASE_PATH}/linux-x64/native/libopenzl.so"
            fi
            if [ -f artifacts/openzl-linux-arm64/libopenzl.so ]; then
              cp -f artifacts/openzl-linux-arm64/libopenzl.so "${DEST_BASE_PATH}/linux-arm64/native/libopenzl.so"
            fi

            # macOS
            if [ -f artifacts/openzl-osx-x64/libopenzl.dylib ]; then
              cp -f artifacts/openzl-osx-x64/libopenzl.dylib "${DEST_BASE_PATH}/osx-x64/native/libopenzl.dylib"
            fi
            if [ -f artifacts/openzl-osx-arm64/libopenzl.dylib ]; then
              cp -f artifacts/openzl-osx-arm64/libopenzl.dylib "${DEST_BASE_PATH}/osx-arm64/native/libopenzl.dylib"
            fi

            # iOS
            if [ -f artifacts/openzl-ios-arm64/libopenzl.a ]; then
              cp -f artifacts/openzl-ios-arm64/libopenzl.a "${DEST_BASE_PATH}/ios-arm64/native/libopenzl.a"
            fi
            if [ -f artifacts/openzl-ios-x86_64/libopenzl.a ]; then
              cp -f artifacts/openzl-ios-x86_64/libopenzl.a "${DEST_BASE_PATH}/ios-x64/native/libopenzl.a"
            fi

            # Catalyst
            if [ -f artifacts/openzl-maccatalyst-arm64/libopenzl.a ]; then
              cp -f artifacts/openzl-maccatalyst-arm64/libopenzl.a "${DEST_BASE_PATH}/maccatalyst-arm64/native/libopenzl.a"
            fi
            if [ -f artifacts/openzl-maccatalyst-x64/libopenzl.a ]; then
              cp -f artifacts/openzl-maccatalyst-x64/libopenzl.a "${DEST_BASE_PATH}/maccatalyst-x64/native/libopenzl.a"
            fi

            # Android
            if [ -f artifacts/openzl-android-arm/libopenzl.so ]; then
              cp -f artifacts/openzl-android-arm/libopenzl.so "${DEST_BASE_PATH}/android-arm/native/libopenzl.so"
            fi
            if [ -f artifacts/openzl-android-arm64/libopenzl.so ]; then
              cp -f artifacts/openzl-android-arm64/libopenzl.so "${DEST_BASE_PATH}/android-arm64/native/libopenzl.so"
            fi
            if [ -f artifacts/openzl-android-x86_64/libopenzl.so ]; then
              cp -f artifacts/openzl-android-x86_64/libopenzl.so "${DEST_BASE_PATH}/android-x64/native/libopenzl.so"
            fi

          echo "::endgroup::"

      - name: Check generated changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git add openzl src/NativeCompressions.OpenZL.Runtime/runtimes
          if git diff --cached --quiet; then
            echo "No OpenZL submodule or binary changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Reuse an open PR. Remember the remote SHA to protect concurrent edits.
          PR_URL=$(gh pr list --base main --head "$NEW_BRANCH_NAME" --state open --json url --jq '.[0].url // empty')
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$NEW_BRANCH_NAME" | cut -f1)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "remote_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"

          # Compare against the open PR branch when there is one, otherwise against main.
          BASE_REF="HEAD"
          if [ -n "$PR_URL" ]; then
            git fetch origin "$REMOTE_SHA"
            BASE_REF="$REMOTE_SHA"
            if git diff --cached --quiet "$BASE_REF" -- openzl src/NativeCompressions.OpenZL.Runtime/runtimes; then
              echo "Existing PR already contains these OpenZL binaries: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # Binaries differing while the submodule stays put is usually the hosted runner
          # toolchain moving under us (MSVC/VC++, Xcode, NDK bumps), not anything upstream.
          # Only a manual run turns that into a PR; scheduled runs just report it.
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && git diff --cached --quiet "$BASE_REF" -- openzl; then
            {
              echo '### OpenZL binary-only changes (no PR)'
              echo 'The openzl submodule is unchanged, so these bytes come from the build environment.'
              echo 'Run this workflow manually (workflow_dispatch) to turn them into a PR.'
              echo '```text'
              git diff --cached --stat "$BASE_REF" -- src/NativeCompressions.OpenZL.Runtime/runtimes
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --cached --stat | tee artifacts/openzl-changes.txt
          {
            echo '### OpenZL submodule / binary changes'
            echo '```text'
            cat artifacts/openzl-changes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -m "automate: Update OpenZL native libraries (${LATEST_TAG})"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # create or update PR only when generated content changed
      - name: Push branch and create or update PR
        if: ${{ steps.changes.outputs.changed == 'true' }}
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.changes.outputs.pr_url }}
          REMOTE_SHA: ${{ steps.changes.outputs.remote_sha }}
        run: |
          # This automation branch is regenerated from the checked-out source.
          # A changed remote branch fails the lease instead of being overwritten.
          git push --force-with-lease="refs/heads/$NEW_BRANCH_NAME:$REMOTE_SHA" origin "HEAD:refs/heads/$NEW_BRANCH_NAME"

          cat <<'EOF' > artifacts/pr_body.txt
          This PR updates the OpenZL submodule and/or generated native libraries.
          Binary-only changes can occur without a new upstream release.

          ## Changed files
          EOF
          printf '\n```text\n' >> artifacts/pr_body.txt
          cat artifacts/openzl-changes.txt >> artifacts/pr_body.txt
          printf '```\n' >> artifacts/pr_body.txt
          printf '\nOpenZL source commit: `%s`\n' "$(git -C openzl rev-parse HEAD)" >> artifacts/pr_body.txt
          printf '\nNative libraries were built in CI; the follow-up build validates this update.\n' >> artifacts/pr_body.txt

          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file artifacts/pr_body.txt
          else
            PR_URL=$(gh pr create --title "automate: Update OpenZL native libraries (${LATEST_TAG})" --base main --head "$NEW_BRANCH_NAME" --body-file artifacts/pr_body.txt)
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [check_new_release, create-pr]
    if: ${{ needs.create-pr.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-debug.yaml
    with:
      git-ref: ${{ needs.create-pr.outputs.commit_sha }}
