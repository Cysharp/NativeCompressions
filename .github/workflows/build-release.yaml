name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: true will never create relase/nuget."
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-release:
    permissions:
      contents: read
    uses: Cysharp/Actions/.github/workflows/validate-release.yaml@main
    with:
      tag: ${{ inputs.tag }}

  build-dotnet:
    needs: [validate-release]
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          ref: ${{ github.sha }}
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      # Core projects include iOS targets only on macOS; pack here to include all target frameworks.
      - run: dotnet workload install ios maccatalyst
      - run: dotnet build -c Release -p:Version="$VERSION"
      # runs the test project on net8.0, net9.0 and net11.0 against the matching library builds
      - run: dotnet test -c Release --no-build
      # symbol packages (snupkg) are configured in Directory.Build.targets, only for packages that contain an assembly
      - run: dotnet pack -c Release -p:Version="$VERSION" -o ./publish
      # the netstandard builds of the library have their own code paths (no RandomAccess, polyfills), run the tests against them too
      - run: dotnet test -c Release -f net8.0 -p:TestCoreTfm=netstandard2.0 -p:Version="$VERSION"
      - run: dotnet test -c Release -f net8.0 -p:TestCoreTfm=netstandard2.1 -p:Version="$VERSION"
      # Store artifacts.
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: nuget
          path: ./publish/
          retention-days: 1

  # release
  create-release:
    needs: [validate-release, build-dotnet]
    permissions:
      contents: write
    uses: Cysharp/Actions/.github/workflows/create-release.yaml@main
    with:
      commit-id: ${{ github.sha }}
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ needs.validate-release.outputs.tag }}

  publish-package:
    needs: [validate-release, create-release]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publish in the calling repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/publish-nuget@main
        with:
          artifact-name: nuget
          user: ${{ secrets.NUGET_USER }}
          version: ${{ needs.validate-release.outputs.version }}
