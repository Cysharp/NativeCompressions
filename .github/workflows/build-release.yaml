name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: true will never create relase/nuget."
        required: true
        default: false
        type: boolean

jobs:
  build-dotnet:
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x
      # Core projects target net10.0-ios. The iOS workload is only available on Windows and macOS hosts.
      - run: dotnet workload install ios
      - run: dotnet build -c Release -p:Version=${{ inputs.tag }}
      # runs the test project on net8.0, net9.0 and net11.0 against the matching library builds
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release -p:Version=${{ inputs.tag }} -o ./publish
      # the netstandard builds of the library have their own code paths (no RandomAccess, polyfills), run the tests against them too
      - run: dotnet test -c Release -f net8.0 -p:TestCoreTfm=netstandard2.0 -p:Version=${{ inputs.tag }}
      - run: dotnet test -c Release -f net8.0 -p:TestCoreTfm=netstandard2.1 -p:Version=${{ inputs.tag }}
      # Store artifacts.
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: nuget
          path: ./publish/
          retention-days: 1

  # release
  create-release:
    needs: [build-dotnet]
    permissions:
      contents: write
      id-token: write # required for NuGet Trusted Publish
    uses: Cysharp/Actions/.github/workflows/create-release.yaml@main
    with:
      commit-id: ""
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      nuget-push: true
      release-upload: false
    secrets: inherit
