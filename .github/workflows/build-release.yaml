name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: true will never create relase/nuget."
        required: true
        default: false
        type: boolean

jobs:
  build-dotnet:
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publish
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      # Core projects include iOS targets only on macOS; pack here to include all target frameworks.
      - run: dotnet workload install ios maccatalyst
      - run: dotnet build -c Release -p:Version=${{ inputs.tag }}
      # runs the test project on net8.0, net9.0 and net11.0 against the matching library builds
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release -p:Version=${{ inputs.tag }} -p:IncludeSymbols=true -o ./publish
      # the netstandard builds of the library have their own code paths (no RandomAccess, polyfills), run the tests against them too
      - run: dotnet test -c Release -f net8.0 -p:TestCoreTfm=netstandard2.0 -p:Version=${{ inputs.tag }}
      - run: dotnet test -c Release -f net8.0 -p:TestCoreTfm=netstandard2.1 -p:Version=${{ inputs.tag }}
      # Store artifacts.
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: nuget
          path: ./publish/
          retention-days: 1
      # push nuget
      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "./publish/*.nupkg" --skip-duplicate -s https://api.nuget.org/v3/index.json -k "${NUGET_KEY}"
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      - run: dotnet nuget push "./publish/*.snupkg" --skip-duplicate -s https://api.nuget.org/v3/index.json -k "${NUGET_KEY}"
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  # release
  create-release:
    needs: [build-dotnet]
    permissions:
      contents: write
      id-token: write # required for NuGet Trusted Publish
    uses: Cysharp/Actions/.github/workflows/create-release.yaml@main
    with:
      commit-id: ""
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      nuget-push: false
      release-upload: false
    secrets: inherit
