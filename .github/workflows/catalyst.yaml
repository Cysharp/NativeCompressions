name: Catalyst

on:
  workflow_dispatch:
  push:
    branches: [catalyst]
    paths:
      - .github/workflows/catalyst.yaml
      - .github/docs/plans/collect-catalyst-environment.sh
      - tests/NativeCompressions.Catalyst.SmokeTests/**
      - src/NativeCompressions.LZ4.Core/**
      - bindgen/liblz4/**
      - lz4

permissions:
  contents: read

jobs:
  environment:
    name: environment-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            clang-arch: arm64
          - runner: macos-26-intel
            arch: x64
            clang-arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - name: Prepare isolated SDK validation
        run: |
          mkdir -p "$RUNNER_TEMP/catalyst-phase0/evidence"
          cd "$RUNNER_TEMP/catalyst-phase0"
          cat > global.json <<'EOF'
          {"sdk":{"version":"10.0.401","rollForward":"disable","allowPrerelease":false}}
          EOF
          test "$(dotnet --version)" = 10.0.401
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee evidence/xcode.txt
          grep -q '^Xcode 26.6$' evidence/xcode.txt
      - name: Install pinned Apple workloads
        working-directory: ${{ runner.temp }}/catalyst-phase0
        run: dotnet workload install ios maccatalyst --version 10.0.401 2>&1 | tee evidence/workload-install.log
      - name: Collect environment
        working-directory: ${{ runner.temp }}/catalyst-phase0
        run: |
          bash "$GITHUB_WORKSPACE/.github/docs/plans/collect-catalyst-environment.sh" 2>&1 | tee evidence/environment.log
          printf 'commit=%s\nrunner=%s\narch=%s\nimage=%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageVersion:-unknown}" > evidence/source.txt
          dotnet workload list | grep -q maccatalyst
      - name: Validate Catalyst native compiler target
        working-directory: ${{ runner.temp }}/catalyst-phase0
        env:
          CLANG_ARCH: ${{ matrix.clang-arch }}
        run: |
          cat > probe.c <<'EOF'
          #include <TargetConditionals.h>
          #if !TARGET_OS_MACCATALYST
          #error Expected Mac Catalyst
          #endif
          int catalyst_probe(void) { return 0; }
          EOF
          xcrun --sdk macosx clang -target "$CLANG_ARCH-apple-ios15.0-macabi" -isysroot "$(xcrun --sdk macosx --show-sdk-path)" -c probe.c -o probe.o
          xcrun vtool -show-build probe.o | tee evidence/native-target.txt
          grep -q MACCATALYST evidence/native-target.txt
      - name: Validate Catalyst managed SDK
        working-directory: ${{ runner.temp }}/catalyst-phase0
        env:
          TARGET_RID: maccatalyst-${{ matrix.arch }}
        run: |
          mkdir managed
          cat > managed/Probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0-maccatalyst</TargetFramework>
              <SupportedOSPlatformVersion>15.0</SupportedOSPlatformVersion>
            </PropertyGroup>
          </Project>
          EOF
          printf 'public static class Probe { public static int Value => 0; }\n' > managed/Probe.cs
          dotnet build managed/Probe.csproj -c Release -r "$TARGET_RID" 2>&1 | tee evidence/managed-build.log
      - name: Save evidence
        if: always()
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: catalyst-phase0-${{ matrix.arch }}
          path: ${{ runner.temp }}/catalyst-phase0/evidence/
          if-no-files-found: error
          retention-days: 30

  lz4-arm64:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: tests/NativeCompressions.Catalyst.SmokeTests
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.401
      - name: Install pinned Apple workloads
        run: |
          test "$(dotnet --version)" = 10.0.401
          test -d "$DEVELOPER_DIR"
          dotnet workload install ios maccatalyst --version 10.0.401
      - name: Record environment and native build
        run: |
          mkdir -p ../../artifacts/catalyst-phase1/evidence
          {
            git rev-parse HEAD
            git -C ../../lz4 rev-parse HEAD
            sw_vers
            uname -m
            dotnet --info
            dotnet workload --info
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-path
          } > ../../artifacts/catalyst-phase1/evidence/environment.txt
          bash build-native.sh 2>&1 | tee ../../artifacts/catalyst-phase1/evidence/native-build.log
      - name: Build LZ4 Core for Catalyst only
        run: bash build-core.sh 2>&1 | tee ../../artifacts/catalyst-phase1/evidence/core-build.log
      - name: Build signed Catalyst app
        run: |
          # Core was built separately; app restore has no multi-target ProjectReference.
          dotnet build -c Release \
            -p:ArtifactsPath="$GITHUB_WORKSPACE/artifacts/catalyst-phase1/managed" \
            -bl:"$GITHUB_WORKSPACE/artifacts/catalyst-phase1/evidence/app-build.binlog" \
            2>&1 | tee ../../artifacts/catalyst-phase1/evidence/app-build.log
      - name: Run LZ4 round trip inside Catalyst
        run: |
          app_root="$GITHUB_WORKSPACE/artifacts/catalyst-phase1/managed/bin"
          evidence="$GITHUB_WORKSPACE/artifacts/catalyst-phase1/evidence"
          mkdir -p "$evidence"
          if [ ! -d "$app_root" ]; then
            echo "::error::App build output directory does not exist: $app_root"
            exit 1
          fi
          # Bundle names follow ApplicationTitle and need not match AssemblyName.
          find "$app_root" -type d -name '*.app' -prune > "$evidence/app-paths.txt"
          app_count="$(wc -l < "$evidence/app-paths.txt" | tr -d ' ')"
          echo "Found $app_count app bundle(s) under $app_root:"
          cat "$evidence/app-paths.txt"
          if [ "$app_count" != 1 ]; then
            echo "::error::Expected exactly one app bundle; found $app_count. See app-paths.txt."
            exit 1
          fi
          app="$(cat "$evidence/app-paths.txt")"
          echo "Verifying signature: $app"
          if ! codesign --verify --deep --strict --verbose=2 "$app" > "$evidence/codesign.log" 2>&1; then
            cat "$evidence/codesign.log"
            echo "::error::App signature verification failed: $app"
            exit 1
          fi
          cat "$evidence/codesign.log"
          echo "Launching Catalyst LZ4 smoke test: $app"
          python3 -u run-app.py "$app" "$evidence" 2>&1 | tee "$evidence/run-app.log"
      - name: Save diagnostics
        if: always()
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: catalyst-phase1-arm64
          path: |
            artifacts/catalyst-phase1/evidence/
            artifacts/catalyst-phase1/native/
          if-no-files-found: error
          retention-days: 30
