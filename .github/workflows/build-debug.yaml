name: Build-Debug

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      git-ref:
        required: true
        type: string
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build-test:
    name: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: win-x64
            runner: windows-2025
          - platform: win-arm64
            runner: windows-11-arm
          - platform: osx-x64
            runner: macos-26-intel
          - platform: osx-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          ref: ${{ inputs.git-ref || github.sha }}
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      # Core projects include iOS targets only on macOS.
      - run: dotnet workload install ios
        if: ${{ runner.os == 'macOS' }}
      # Build the complete solution on every OS; macOS also includes iOS targets.
      - run: dotnet build -c Release
      # Run net8.0, net9.0 and net11.0 against the matching library builds on every OS.
      - run: dotnet test -c Release --no-build
        working-directory: tests/NativeCompressions.Tests
      - run: dotnet pack -c Release --no-build -p:IncludeSymbols=true
      # Exercise the netstandard2.1-specific library code paths on every OS too.
      - run: dotnet test -c Release -f net8.0 -p:TestCoreTfm=netstandard2.1
        working-directory: tests/NativeCompressions.Tests
