name: Build-Native-LZ4

# Follow LZ4 latest release by cron update
# 1.  Check for LZ4 updates - compare submodule commit ID with latest release commit
# 2.  If no changes, checkout in each build job, build and upload artifacts.
# 2". If changes exist, update submodule after checkout in each build job, build and upload artifacts
# 3.  Upload packages to GitHub Actions summary
# 4.  If the submodule or generated binaries differ, create or update the release's PR.
#     Binary-only differences (submodule unchanged) only open a PR on a workflow_dispatch run, to avoid Windows hosted runner changes affecting the binaries.
#     PR includes following changes.
#     - Commit that updates the submodule
#     - Commit that lz4 dynamic lib artifacts placed in src/NativeCompressions.LZ4.Runtime/runtimes/{platform_name}/native/{lib}
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Every day at 3:00 AM (UTC)

# deterministic builds
env:
  ZERO_AR_DATE: "1"

jobs:
  check_new_release:
    permissions:
      contents: read
    uses: ./.github/workflows/check-new-release.yaml
    with:
      repository: lz4/lz4
      submodule_path: lz4

  build-windows:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        arch: [x64]
        include:
          - arch: x64
            platform: x64
            msys_env: MINGW64
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd lz4
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated lz4 submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Setup MSYS2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2.30.0
        with:
          msystem: ${{ matrix.msys_env }}
          update: true
          install: >-
            ${{ matrix.arch == 'x64' && 'mingw-w64-x86_64-gcc mingw-w64-x86_64-make' || 'mingw-w64-clang-aarch64-gcc mingw-w64-clang-aarch64-make' }}
            make
      - name: Build DLL
        shell: msys2 {0}
        env:
          LDFLAGS: -Wl,--no-insert-timestamp
        run: |
          cd lz4/lib
          make BUILD_STATIC=no BUILD_SHARED=yes SRCFILES="lz4.c lz4hc.c lz4frame.c xxhash.c" -j "$(nproc)"
          ls -la *.dll
          file *.dll
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/win-${{ matrix.arch }}
          cp lz4/lib/liblz4.dll artifacts/win-${{ matrix.arch }}/lz4.dll
      - name: Upload Windows artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-win-${{ matrix.arch }}
          path: artifacts/win-${{ matrix.arch }}/*
          if-no-files-found: error

  build-windows-arm64:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd lz4
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated lz4 submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Build using Docker
        run: |
          docker run --rm -v "$PWD:/work" -e LDFLAGS=-Wl,--no-insert-timestamp \
            mstorsjo/llvm-mingw:latest \
            bash -c "cd /work/lz4/lib && \
              make BUILD_STATIC=no BUILD_SHARED=yes \
              TARGET_OS=Windows_NT LIBLZ4_NAME=lz4 \
              CC=aarch64-w64-mingw32-gcc WINDRES=aarch64-w64-mingw32-windres \
              SRCFILES='lz4.c lz4hc.c lz4frame.c xxhash.c'"
          file lz4/lib/lz4.dll
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/win-arm64
          cp lz4/lib/lz4.dll artifacts/win-arm64/
      - name: Upload artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-win-arm64
          path: artifacts/win-arm64/*
          if-no-files-found: error

  build-linux:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64, arm64]
        glibc: ["2.31"]
        cc: [gcc-10]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Pin glibc to matrix.glibc by building inside Ubuntu 20.04 (glibc 2.31) instead of letting the hosted runner image decide it.
    container:
      image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 15
    env:
      CC: ${{ matrix.cc }}
      GLIBC_VERSION: ${{ matrix.glibc }}
    steps:
      - name: Verify container glibc
        run: |
          actual="$(ldd --version | head -1 | awk '{ print $NF }')"
          if [ "${actual}" != "${GLIBC_VERSION}" ]; then
            echo "::error::container glibc is ${actual}, but matrix.glibc is ${GLIBC_VERSION}"
            exit 1
          fi
      # git must be present before checkout, otherwise actions/checkout falls back to the tarball API and skips submodules.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            file \
            "${CC}" \
            git \
            make
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd lz4
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated lz4 submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Build shared library
        run: |
          cd lz4/lib
          make BUILD_STATIC=no BUILD_SHARED=yes CC="${CC}" SRCFILES="lz4.c lz4hc.c lz4frame.c xxhash.c" -j "$(nproc)"
          ls -la ./*.so*
          file liblz4.so*
      - name: Verify glibc requirement
        run: |
          max_glibc="$(objdump -T lz4/lib/liblz4.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "liblz4.so requires glibc ${max_glibc} or newer"
          if [ "$(printf '%s\n%s\n' "${max_glibc}" "${GLIBC_VERSION}" | sort -V | tail -1)" != "${GLIBC_VERSION}" ]; then
            echo "::error::liblz4.so requires glibc ${max_glibc}, above matrix.glibc (${GLIBC_VERSION})"
            exit 1
          fi
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/linux-${{ matrix.arch }}
          cp -L lz4/lib/liblz4.so artifacts/linux-${{ matrix.arch }}/
      - name: Upload Linux artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-linux-${{ matrix.arch }}
          path: artifacts/linux-${{ matrix.arch }}/*
          if-no-files-found: error

  build-macos:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            flags: "-arch x86_64"
          - arch: arm64
            flags: "-arch arm64"
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd lz4
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated lz4 submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Build dynamic library
        run: |
          cd lz4/lib
          make BUILD_STATIC=no BUILD_SHARED=yes CFLAGS="${{ matrix.flags }} -O3" SRCFILES="lz4.c lz4hc.c lz4frame.c xxhash.c" -j "$(sysctl -n hw.ncpu)"
          ls -la
          lipo -info liblz4.dylib
          file -L liblz4.dylib
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/osx-${{ matrix.arch }}
          cp -L lz4/lib/liblz4.dylib artifacts/osx-${{ matrix.arch }}/
      - name: Upload artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-osx-${{ matrix.arch }}
          path: artifacts/osx-${{ matrix.arch }}/*
          if-no-files-found: error

  build-ios:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            sdk: iphoneos
            target: aarch64-apple-ios11.0
            cflags: "-arch arm64 -mios-version-min=11.0"
          - arch: x86_64
            sdk: iphonesimulator
            target: x86_64-apple-ios11.0-simulator
            cflags: "-arch x86_64 -mios-simulator-version-min=11.0"
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd lz4
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated lz4 submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Build static library for iOS
        run: |
          SDK_PATH=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)

          # Build static library (iOS App Store requires static linking)
          cd lz4/lib
          make BUILD_STATIC=yes BUILD_SHARED=no CC="clang" CFLAGS="${{ matrix.cflags }} -O3 -isysroot $SDK_PATH -DXXH_NAMESPACE=LZ4_" SRCFILES="lz4.c lz4hc.c lz4frame.c xxhash.c" -j "$(sysctl -n hw.ncpu)"

          ls -la liblz4.a
          file liblz4.a
          lipo -info liblz4.a
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/ios-${{ matrix.arch }}
          cp lz4/lib/liblz4.a artifacts/ios-${{ matrix.arch }}/
      - name: Upload iOS artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-ios-${{ matrix.arch }}
          path: artifacts/ios-${{ matrix.arch }}/*
          if-no-files-found: error

  build-catalyst:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        include:
          - arch: arm64
            clang-arch: arm64
          - arch: x64
            clang-arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd lz4
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated lz4 submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Build static library for Mac Catalyst
        shell: bash
        run: |
          output="$GITHUB_WORKSPACE/lz4/lib"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          for source in lz4 lz4hc lz4frame xxhash; do
            xcrun --sdk macosx clang -target "${{ matrix.clang-arch }}-apple-ios15.0-macabi" -isysroot "$sdk" -O3 -DXXH_NAMESPACE=LZ4_ -c "lz4/lib/$source.c" -o "$output/$source.o"
            xcrun vtool -show-build "$output/$source.o" | grep MACCATALYST
          done
          xcrun libtool -static -o "$output/liblz4.a" "$output/lz4.o" "$output/lz4hc.o" "$output/lz4frame.o" "$output/xxhash.o"
          file "$output/liblz4.a"
          lipo -info "$output/liblz4.a"
          test "$(xcrun lipo -archs "$output/liblz4.a")" = "${{ matrix.clang-arch }}"
          xcrun nm -gU "$output/liblz4.a" > "$output/symbols.txt"
          grep ' _LZ4_versionNumber$' "$output/symbols.txt"
          grep ' _LZ4F_compressFrame$' "$output/symbols.txt"
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/maccatalyst-${{ matrix.arch }}
          cp lz4/lib/liblz4.a artifacts/maccatalyst-${{ matrix.arch }}/
      - name: Upload Catalyst artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-maccatalyst-${{ matrix.arch }}
          path: artifacts/maccatalyst-${{ matrix.arch }}/*
          if-no-files-found: error

  build-android:
    needs: [check_new_release]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
        include:
          - abi: armeabi-v7a
            arch: arm # Unity require this for mobile app
            target: armv7a-linux-androideabi21
            cc: armv7a-linux-androideabi21-clang
          - abi: arm64-v8a
            arch: arm64 # Most mobile app
            target: aarch64-linux-android21
            cc: aarch64-linux-android21-clang
          - abi: x86_64
            arch: x86_64 # Chromebook and Google Play for PC (not emulation)
            target: x86_64-linux-android21
            cc: x86_64-linux-android21-clang
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          cd lz4
            git fetch --tags
            git checkout ${{ needs.check_new_release.outputs.latest_tag }}
          cd ..
          echo "Updated lz4 submodule to ${{ needs.check_new_release.outputs.latest_tag }}"
      - name: Setup Android NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false
      - name: Build shared library for Android
        run: |
          export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          cd lz4/lib
          make BUILD_STATIC=no BUILD_SHARED=yes CC="${{ matrix.cc }}" CFLAGS="-O3 -fPIC -DXXH_NAMESPACE=LZ4_" SRCFILES="lz4.c lz4hc.c lz4frame.c xxhash.c" -j "$(nproc)"
          ls -la liblz4.so*
          file liblz4.so*
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/android-${{ matrix.arch }}
          cp lz4/lib/liblz4.so artifacts/android-${{ matrix.arch }}/
      - name: Upload Android artifacts
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-android-${{ matrix.arch }}
          path: artifacts/android-${{ matrix.arch }}/*
          if-no-files-found: error

  package-all:
    needs:
      [
        check_new_release,
        build-windows,
        build-windows-arm64,
        build-linux,
        build-macos,
        build-ios,
        build-catalyst,
        build-android,
      ]
    if: ${{ needs.check_new_release.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download all artifacts
        uses: Cysharp/Actions/.github/actions/download-artifact@main
        with:
          path: artifacts
      - name: Create .NET runtime structure
        run: |
          mkdir -p release/runtimes/{win-x64,win-arm64}/native
          mkdir -p release/runtimes/{linux-x64,linux-arm64}/native
          mkdir -p release/runtimes/{osx-x64,osx-arm64}/native
          mkdir -p release/runtimes/{android-arm,android-arm64,android-x64}/native
          mkdir -p release/runtimes/{ios-arm64,ios-x64}/native
          mkdir -p release/runtimes/{maccatalyst-arm64,maccatalyst-x64}/native

          # Windows
          if [ -f artifacts/lz4-win-x64/lz4.dll ]; then
            cp -f artifacts/lz4-win-x64/lz4.dll release/runtimes/win-x64/native/lz4.dll
          fi
          if [ -f artifacts/lz4-win-arm64/lz4.dll ]; then
            cp -f artifacts/lz4-win-arm64/lz4.dll release/runtimes/win-arm64/native/lz4.dll
          fi

          # Linux
          if [ -f artifacts/lz4-linux-x64/liblz4.so ]; then
            cp artifacts/lz4-linux-x64/liblz4.so release/runtimes/linux-x64/native/
          fi
          if [ -f artifacts/lz4-linux-arm64/liblz4.so ]; then
            cp artifacts/lz4-linux-arm64/liblz4.so release/runtimes/linux-arm64/native/
          fi

          # macOS
          for file in artifacts/lz4-osx-x64/*.dylib; do
            [ -f "$file" ] && cp "$file" release/runtimes/osx-x64/native/liblz4.dylib && break
          done
          for file in artifacts/lz4-osx-arm64/*.dylib; do
            [ -f "$file" ] && cp "$file" release/runtimes/osx-arm64/native/liblz4.dylib && break
          done

          # iOS
          if [ -f artifacts/lz4-ios-arm64/liblz4.a ]; then
            cp artifacts/lz4-ios-arm64/liblz4.a release/runtimes/ios-arm64/native/
          fi
          if [ -f artifacts/lz4-ios-x86_64/liblz4.a ]; then
            cp artifacts/lz4-ios-x86_64/liblz4.a release/runtimes/ios-x64/native/
          fi

          # Catalyst
          if [ -f artifacts/lz4-maccatalyst-arm64/liblz4.a ]; then
            cp artifacts/lz4-maccatalyst-arm64/liblz4.a release/runtimes/maccatalyst-arm64/native/
          fi
          if [ -f artifacts/lz4-maccatalyst-x64/liblz4.a ]; then
            cp artifacts/lz4-maccatalyst-x64/liblz4.a release/runtimes/maccatalyst-x64/native/
          fi

          # Android
          if [ -f artifacts/lz4-android-arm/liblz4.so ]; then
            cp artifacts/lz4-android-arm/liblz4.so release/runtimes/android-arm/native/
          fi
          if [ -f artifacts/lz4-android-arm64/liblz4.so ]; then
            cp artifacts/lz4-android-arm64/liblz4.so release/runtimes/android-arm64/native/
          fi
          if [ -f artifacts/lz4-android-x86_64/liblz4.so ]; then
            cp artifacts/lz4-android-x86_64/liblz4.so release/runtimes/android-x64/native/
          fi
      - name: Create archives
        run: |
          cd release
          tar czf ../lz4-native-libraries.tar.gz .
          zip -r ../lz4-native-libraries.zip .
      - name: Upload package
        uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: lz4-native-package
          path: |
            lz4-native-libraries.tar.gz
          if-no-files-found: error

  create-pr:
    needs: [check_new_release, package-all]
    if: ${{ needs.package-all.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      commit_sha: ${{ steps.create_pr.outputs.commit_sha }}
    env:
      NEW_BRANCH_NAME: "automate/lz4-${{ needs.check_new_release.outputs.latest_tag }}"
      LATEST_TAG: ${{ needs.check_new_release.outputs.latest_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          submodules: recursive
      - name: Configure Git
        run: |
          git remote set-url origin "https://github-actions:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create new branch
        run: git checkout -b "${NEW_BRANCH_NAME}"
      # update submodule
      - name: Update submodule to latest release
        if: ${{ needs.check_new_release.outputs.needs_update == 'true' }}
        run: |
          echo "Updated lz4 submodule to ${LATEST_TAG}"
          cd lz4
            git fetch --tags
            git checkout "${LATEST_TAG}"
          cd ..
      # update runtimes
      - name: Download all artifacts
        uses: Cysharp/Actions/.github/actions/download-artifact@main
        with:
          path: artifacts
      - name: Place new runtimes
        env:
          DEST_BASE_PATH: src/NativeCompressions.LZ4.Runtime/runtimes
        run: |
          echo "Updated lz4 runtimes to ${LATEST_TAG}"

          for arch in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64 ios-arm64 ios-x64 maccatalyst-arm64 maccatalyst-x64 android-arm android-arm64 android-x64; do
            mkdir -p "${DEST_BASE_PATH}/${arch}/native"
          done

          # Show current
          echo "::group::Show artifacts/"
            ls -lR artifacts/
          echo "::endgroup::"

          echo "::group::Show ${DEST_BASE_PATH}/"
            ls -lR "${DEST_BASE_PATH}/"
          echo "::endgroup::"

          echo "::group::Copy new files"

            # Windows
            if [ -f artifacts/lz4-win-x64/lz4.dll ]; then
              cp -f artifacts/lz4-win-x64/lz4.dll "${DEST_BASE_PATH}/win-x64/native/lz4.dll"
            fi
            if [ -f artifacts/lz4-win-arm64/lz4.dll ]; then
              cp -f artifacts/lz4-win-arm64/lz4.dll "${DEST_BASE_PATH}/win-arm64/native/lz4.dll"
            fi

            # Linux
            if [ -f artifacts/lz4-linux-x64/liblz4.so ]; then
              cp -f artifacts/lz4-linux-x64/liblz4.so "${DEST_BASE_PATH}/linux-x64/native/liblz4.so"
            fi
            if [ -f artifacts/lz4-linux-arm64/liblz4.so ]; then
              cp -f artifacts/lz4-linux-arm64/liblz4.so "${DEST_BASE_PATH}/linux-arm64/native/liblz4.so"
            fi

            # macOS
            if [ -f artifacts/lz4-osx-x64/liblz4.dylib ]; then
              cp -f artifacts/lz4-osx-x64/liblz4.dylib "${DEST_BASE_PATH}/osx-x64/native/liblz4.dylib"
            fi
            if [ -f artifacts/lz4-osx-arm64/liblz4.dylib ]; then
              cp -f artifacts/lz4-osx-arm64/liblz4.dylib "${DEST_BASE_PATH}/osx-arm64/native/liblz4.dylib"
            fi

            # iOS
            if [ -f artifacts/lz4-ios-arm64/liblz4.a ]; then
              cp -f artifacts/lz4-ios-arm64/liblz4.a "${DEST_BASE_PATH}/ios-arm64/native/liblz4.a"
            fi
            if [ -f artifacts/lz4-ios-x86_64/liblz4.a ]; then
              cp -f artifacts/lz4-ios-x86_64/liblz4.a "${DEST_BASE_PATH}/ios-x64/native/liblz4.a"
            fi

            # Catalyst
            if [ -f artifacts/lz4-maccatalyst-arm64/liblz4.a ]; then
              cp -f artifacts/lz4-maccatalyst-arm64/liblz4.a "${DEST_BASE_PATH}/maccatalyst-arm64/native/liblz4.a"
            fi
            if [ -f artifacts/lz4-maccatalyst-x64/liblz4.a ]; then
              cp -f artifacts/lz4-maccatalyst-x64/liblz4.a "${DEST_BASE_PATH}/maccatalyst-x64/native/liblz4.a"
            fi

            # Android
            if [ -f artifacts/lz4-android-arm/liblz4.so ]; then
              cp -f artifacts/lz4-android-arm/liblz4.so "${DEST_BASE_PATH}/android-arm/native/liblz4.so"
            fi
            if [ -f artifacts/lz4-android-arm64/liblz4.so ]; then
              cp -f artifacts/lz4-android-arm64/liblz4.so "${DEST_BASE_PATH}/android-arm64/native/liblz4.so"
            fi
            if [ -f artifacts/lz4-android-x86_64/liblz4.so ]; then
              cp -f artifacts/lz4-android-x86_64/liblz4.so "${DEST_BASE_PATH}/android-x64/native/liblz4.so"
            fi

          echo "::endgroup::"

      - name: Check generated changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git add lz4 src/NativeCompressions.LZ4.Runtime/runtimes
          if git diff --cached --quiet; then
            echo "No LZ4 submodule or binary changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Reuse an open PR. Remember the remote SHA to protect concurrent edits.
          PR_URL=$(gh pr list --base main --head "$NEW_BRANCH_NAME" --state open --json url --jq '.[0].url // empty')
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$NEW_BRANCH_NAME" | cut -f1)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "remote_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"

          # Compare against the open PR branch when there is one, otherwise against main.
          BASE_REF="HEAD"
          if [ -n "$PR_URL" ]; then
            git fetch origin "$REMOTE_SHA"
            BASE_REF="$REMOTE_SHA"
            if git diff --cached --quiet "$BASE_REF" -- lz4 src/NativeCompressions.LZ4.Runtime/runtimes; then
              echo "Existing PR already contains these LZ4 binaries: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # Binaries differing while the submodule stays put is usually the hosted runner
          # toolchain moving under us (MSVC/VC++, Xcode, NDK bumps), not anything upstream.
          # Only a manual run turns that into a PR; scheduled runs just report it.
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && git diff --cached --quiet "$BASE_REF" -- lz4; then
            {
              echo '### LZ4 binary-only changes (no PR)'
              echo 'The lz4 submodule is unchanged, so these bytes come from the build environment.'
              echo 'Run this workflow manually (workflow_dispatch) to turn them into a PR.'
              echo '```text'
              git diff --cached --stat "$BASE_REF" -- src/NativeCompressions.LZ4.Runtime/runtimes
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --cached --stat | tee artifacts/lz4-changes.txt
          {
            echo '### LZ4 submodule / binary changes'
            echo '```text'
            cat artifacts/lz4-changes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -m "automate: Update LZ4 native libraries (${LATEST_TAG})"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # create or update PR only when generated content changed
      - name: Push branch and create or update PR
        if: ${{ steps.changes.outputs.changed == 'true' }}
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.changes.outputs.pr_url }}
          REMOTE_SHA: ${{ steps.changes.outputs.remote_sha }}
        run: |
          # This automation branch is regenerated from the checked-out source.
          # A changed remote branch fails the lease instead of being overwritten.
          git push --force-with-lease="refs/heads/$NEW_BRANCH_NAME:$REMOTE_SHA" origin "HEAD:refs/heads/$NEW_BRANCH_NAME"

          cat <<'EOF' > artifacts/pr_body.txt
          This PR updates the LZ4 submodule and/or generated native libraries.
          Binary-only changes can occur without a new upstream release.

          ## Changed files
          EOF
          printf '\n```text\n' >> artifacts/pr_body.txt
          cat artifacts/lz4-changes.txt >> artifacts/pr_body.txt
          printf '```\n' >> artifacts/pr_body.txt
          printf '\nLZ4 source commit: `%s`\n' "$(git -C lz4 rev-parse HEAD)" >> artifacts/pr_body.txt
          printf '\nNative libraries were built in CI; the follow-up build validates this update.\n' >> artifacts/pr_body.txt

          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file artifacts/pr_body.txt
          else
            PR_URL=$(gh pr create --title "automate: Update LZ4 native libraries (${LATEST_TAG})" --base main --head "$NEW_BRANCH_NAME" --body-file artifacts/pr_body.txt)
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [check_new_release, create-pr]
    if: ${{ needs.create-pr.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-debug.yaml
    with:
      git-ref: ${{ needs.create-pr.outputs.commit_sha }}
